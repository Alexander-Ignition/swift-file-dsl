name: Test
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  Apple:
    name: Test ${{ matrix.name }}
    runs-on: macOS-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            file: swift-file-dsl-macOS.xcresult
          - name: Mac Catalyst
            file: swift-file-dsl-MacCatalyst.xcresult
          - name: iOS
            file: swift-file-dsl-macOS.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: make Artifacts/${{ matrix.file }}
        shell: bash
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: Artifacts/${{ matrix.file }}
          if-no-files-found: error
  SPM:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: swift test
        shell: bash
  Lint:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: swift-format lint
        run: make lint 2>&1 | .github/scripts/format.swift
        shell: bash
