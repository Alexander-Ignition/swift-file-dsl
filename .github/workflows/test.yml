name: Test
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  Apple:
    name: Test ${{ matrix.name }}
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            file: swift-file-dsl-macOS.xcresult
          - name: MacCatalyst
            file: swift-file-dsl-MacCatalyst.xcresult
          - name: iOS
            file: swift-file-dsl-iOS.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: make Artifacts/${{ matrix.file }}
        shell: bash
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: Artifacts/${{ matrix.file }}
          retention-days: 1
          if-no-files-found: error
  Merge-Results:
    name: Merge results
    runs-on: macOS-latest
    needs: Apple
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download all xcresults
        uses: actions/download-artifact@v8
        with:
          pattern: 'swift-file-*-iOS.xcresult'
          path: Artifacts
      - name: Merge Results
        run: |
          ls -al Artifacts
          make Artifacts/swift-file-dsl.xcresult
        shell: bash
      - name: Upload final xcresult
        uses: actions/upload-artifact@v7
        with:
          name: swift-file-dsl.xcresult
          path: Artifacts/swift-file-dsl.xcresult
  SPM:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: swift test
        shell: bash
  Lint:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: swift-format lint
        run: make lint 2>&1 | .github/scripts/format.swift
        shell: bash
