name: Test
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  Apple:
    name: Test ${{ matrix.name }}
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            target: Artifacts/swift-file-dsl-macOS.xcresult
          - name: MacCatalyst
            target: Artifacts/swift-file-dsl-MacCatalyst.xcresult
          - name: iOS
            target: Artifacts/swift-file-dsl-iOS.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: |
          make ${{ matrix.target }}
          zip -r ${{ matrix.target }}.zip ${{ matrix.target }}
        shell: bash
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-file-dsl-${{ matrix.name }}.xcresult.zip
          path: ${{ matrix.target }}.zip
          retention-days: 1
  Summary:
    runs-on: macOS-latest
    needs: Apple
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download all xcresult
        uses: actions/download-artifact@v8
        with:
          pattern: 'swift-file-dsl-*.xcresult.zip'
          path: Artifacts
      - name: Merge xcresult
        run: |
          ls -al Artifacts
          unzip Artifacts/swift-file-dsl-iOS.xcresult.zip -d Artifacts/
          make Artifacts/swift-file-dsl.xcresult
        shell: bash
      - name: Upload final xcresult
        uses: actions/upload-artifact@v7
        with:
          name: swift-file-dsl.xcresult
          path: Artifacts/swift-file-dsl.xcresult
  SPM:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and test
        run: swift test
        shell: bash
  Lint:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: swift-format lint
        run: make lint 2>&1 | .github/scripts/format.swift
        shell: bash
